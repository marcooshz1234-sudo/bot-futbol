<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Combilocas</title>
<link rel="icon" href="logo.png"><link rel="apple-touch-icon" href="logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1c;--card:#141c2f;--card2:#1e2940;--line:#2a3652;--txt:#ffffff;--mut:#9aa8c3;--ok:#4ade80;--ko:#f87171;--warn:#fbbf24;--acc:#22c55e;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.3px;flex:1}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 14px inherit;font-family:inherit;color:var(--txt);background:var(--card2);cursor:pointer}
.btn.acc{background:var(--acc);color:#04210f}.btn.ko{background:rgba(248,113,113,.15);color:var(--ko)}.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
main{padding:0 16px 150px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:18px 2px 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1;min-width:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut)}
.chip.ok{background:rgba(74,222,128,.14);color:var(--ok)}.chip.ko{background:rgba(248,113,113,.14);color:var(--ko)}.chip.warn{background:rgba(251,191,36,.14);color:var(--warn)}
.hora{font-weight:800;font-size:20px;min-width:58px}
.txt{white-space:pre-wrap;font-size:13.5px;margin-top:8px;max-height:7.5em;overflow:hidden;position:relative}
.txt.abierto{max-height:none}
.txt:not(.abierto)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2em;background:linear-gradient(transparent,var(--card))}
.img{width:100%;border-radius:12px;margin-top:10px;display:block;background:var(--card2);object-fit:contain;max-height:240px}
.acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cancel{opacity:.45}
.red{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
.pend{outline:2px solid var(--warn);outline-offset:2px}
.sug{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sug .btn{text-align:left;font-weight:500}
.sug .btn.sel{background:var(--acc);color:#04210f}
.switch{width:50px;height:30px;border-radius:999px;background:var(--card2);position:relative;border:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#dbe4f5;transition:.2s}
.switch.on{background:var(--acc)}.switch.on::after{left:23px}
.step{display:flex;align-items:center;gap:8px}.step b{min-width:42px;text-align:center;font-size:17px}
input[type=time],textarea{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;font:15px inherit;font-family:inherit}
textarea{width:100%;min-height:200px;margin-top:8px}
.big{font-weight:800;font-size:26px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.barra{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:5px}.barra>div{height:100%;background:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,15,28,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
nav button{background:none;border:0;color:var(--mut);font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;position:relative}
nav button span{font-size:21px}nav button.on{color:var(--ok)}
nav .badge{position:absolute;top:0;right:22%;background:var(--ko);color:#fff;font-size:10px;border-radius:99px;padding:1px 5px}
#aplicar{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));display:none;z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.5);padding:14px;font-size:16px}
.vacio{text-align:center;color:var(--mut);padding:30px 10px}
.aviso{background:rgba(251,191,36,.12);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}

.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.resumen div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.resumen b{display:block;font-size:24px;font-weight:800}.resumen span{font-size:12px;color:var(--mut)}
.prox{background:linear-gradient(135deg,#1e3a8a,#14532d);border:1px solid #3b5bb5;border-radius:16px;padding:14px;margin:8px 0 4px}
.prox .t{font-size:13px;color:#c7d7fe;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.prox .n{font-size:20px;font-weight:800;margin-top:2px}
.post{display:flex;gap:12px;align-items:flex-start}
.post .h{font-weight:800;font-size:22px;min-width:64px;line-height:1.1}
.post .h small{display:block;font-size:12px;font-weight:600;color:var(--mut)}
.post .tit{font-weight:700;font-size:16px}
.post .tipo{font-size:13px;color:var(--mut)}
.banner{display:block;width:100%;height:auto;border-radius:12px;margin-top:10px;background:var(--card2)}
.patas{margin-top:8px;font-size:14px;color:#dbe4f5;line-height:1.55}
.iconos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.iconos .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:12px}
.iconos .btn span{font-size:19px}
.fila-red{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.fila-red:last-child{border-bottom:0}
.pill{font-size:14px;font-weight:700;padding:5px 7px;border-radius:10px;background:var(--card2);color:var(--mut);white-space:nowrap}
.pill.ok{background:rgba(74,222,128,.16);color:var(--ok)}.pill.ko{background:rgba(248,113,113,.18);color:var(--ko)}
.lista{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.logo{width:42px;height:42px;border-radius:50%;box-shadow:0 0 14px rgba(59,130,246,.5)}
header h1 small{display:block;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.3px}

/* 10/11: 🏢 Oficina Combilocas */
@keyframes of-tec{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes of-bri{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes of-flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.of-tit{font-family:"Press Start 2P",monospace;font-size:13px;color:#f5c542;margin:14px 2px 4px;line-height:1.5}
.of-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.of-sala{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:10px;background:#16291f;border:3px solid #2f5a43;box-shadow:4px 4px 0 #000;min-height:210px;color:#e8f3ec;font-family:inherit}
.of-sala.sel{border-color:#f5c542;background:#1d3a2a}
.of-sala:focus-visible{outline:3px solid #f5c542}
.of-cab{display:flex;align-items:center;justify-content:space-between;gap:6px}
.of-nom{font-family:"Press Start 2P",monospace;font-size:9px;color:#f5c542;letter-spacing:.5px}
.of-est{font-size:10px;font-weight:800;padding:2px 6px;border:2px solid}
.of-est.trabajando{background:#14532d;color:#bbf7d0;border-color:#22c55e}.of-est.esperando{background:#3b2f0b;color:#fde68a;border-color:#eab308}
.of-est.pausa{background:#27272a;color:#d4d4d8;border-color:#71717a}.of-est.alerta{background:#450a0a;color:#fecaca;border-color:#ef4444}
.of-boc{background:#fffdf3;color:#1b1b1b;border:3px solid #1b1b1b;box-shadow:3px 3px 0 #000;font-size:12px;font-weight:700;line-height:1.3;padding:6px 8px;animation:of-flo 2.4s ease-in-out infinite}
.of-esc{position:relative;height:96px;margin-top:auto}
.of-suelo{position:absolute;left:-10px;right:-10px;bottom:-10px;height:20px;background:repeating-linear-gradient(90deg,#233d2f 0 18px,#1d3427 18px 36px)}
.of-mesa{position:absolute;left:38%;right:0;bottom:10px;height:12px;background:#8a5a35;border-bottom:5px solid #5e3c22}
.of-mon{position:absolute;left:52%;bottom:27px;width:46px;height:34px;background:#2a2a2a;border:3px solid #111}
.of-mon i{display:block;width:100%;height:100%;background:#334155;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px)}
.of-sala.trabajando .of-mon i,.of-sala.alerta .of-mon i{animation:of-bri 1.6s ease-in-out infinite}
.of-pj{position:absolute;left:12%;bottom:14px;width:46px;height:70px}
.of-pj .ca{position:absolute;left:12px;top:0;width:22px;height:22px;background:#f2c9a0;border:3px solid #1b1b1b}
.of-pj .pe{position:absolute;left:10px;top:-3px;width:26px;height:8px;border:3px solid #1b1b1b;border-bottom:0}
.of-pj .ojo{position:absolute;top:10px;width:3px;height:3px;background:#1b1b1b}
.of-pj .cu{position:absolute;left:8px;top:24px;width:30px;height:36px;border:3px solid #1b1b1b}
.of-pj .br{position:absolute;left:34px;top:32px;width:24px;height:8px;border:3px solid #1b1b1b}
.of-sala.trabajando .of-pj .br,.of-sala.alerta .of-pj .br{animation:of-tec .35s steps(2) infinite}
.of-pie{font-size:11px;color:#a9c4b4}
.of-ficha{margin-top:14px;background:#13261c;border:3px solid #f5c542;box-shadow:5px 5px 0 #000;padding:12px;color:#e8f3ec}
.of-ficha h3{font-family:"Press Start 2P",monospace;font-size:10px;color:#7ee2a8;margin:14px 0 8px}
.of-li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:8px;background:#0e1a14;border:2px solid #23402f;font-size:13px;margin-bottom:6px}
.of-li b{font-family:"Press Start 2P",monospace;font-size:9px;color:#7ee2a8;padding-top:2px}
.of-aj{display:flex;align-items:center;gap:10px;padding:8px;background:#0e1a14;border:2px solid #23402f;margin-bottom:6px}
.of-aj.pend{border-color:#fbbf24}
.of-aj input[type=text]{background:#fffdf3;color:#1b1b1b;border:3px solid #1b1b1b;padding:6px 8px;font:600 14px inherit;font-family:inherit;width:100%;max-width:260px}
.of-pend{background:#fffdf3;color:#1b1b1b;border:3px solid #1b1b1b;box-shadow:3px 3px 0 #000;padding:10px;margin-bottom:8px;font-weight:700;font-size:13px}
.of-pend.pend{outline:3px solid #fbbf24}
.of-pix{border:3px solid #1b1b1b;box-shadow:3px 3px 0 #000;border-radius:0}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="" class="logo">
  <h1>Combilocas<small>Panel del bot</small></h1>
  <span class="mut" id="act"></span>
  <button class="btn sm acc" onclick="subir()">➕ Subir</button>
</header>
<main id="vista"><div class="vacio">Cargando…</div></main>
<button class="btn acc" id="aplicar" onclick="aplicar()"></button>
<nav id="nav"></nav>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0a0f1c"); tg.setBackgroundColor("#0a0f1c"); } catch (e) {} }
const enTelegram = !!(tg && tg.initData);
const BOT = "https://t.me/combilocas_publica_bot";
let D = null, tab = "cola", cambios = [], abiertos = new Set(), editando = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dia = f => { const h = new Date(); const d = f.slice(0,10); const hoy = h.toISOString().slice(0,10);
  const man = new Date(h.getTime()+864e5).toISOString().slice(0,10); return d===hoy?"Hoy":d===man?"Mañana":d.slice(8,10)+"/"+d.slice(5,7) };
const TABS = [["cola","📅","Cola"],["redes","📡","Redes"],["com","💬","Respuestas"],["oficina","🏢","Oficina"],["ajustes","🎛️","Ajustes"],["rend","📈","Números"]];

async function cargar(){
  try { D = await (await fetch("datos.json?t="+Date.now(), {cache:"no-store"})).json(); }
  catch(e){ $("#vista").innerHTML = `<div class="vacio">Sin conexión. Prueba otra vez.</div>`; return; }
  try { D.oficina = await (await fetch("oficina.json?t="+Date.now(), {cache:"no-store"})).json(); } catch(e) { D.oficina = null; }
  $("#act").textContent = "act. " + D.generado.slice(11);
  pintar();
}
function nav(){
  const nc = D.comentarios.length, nf = D.redes.filter(p=>Object.values(p.redes).some(r=>r.error)).length;
  $("#nav").innerHTML = TABS.map(([k,i,n]) => `<button class="${k===tab?"on":""}" onclick="ir('${k}')"><span>${i}</span>${n}${
    k==="com"&&nc?`<i class="badge">${nc}</i>`:k==="redes"&&nf?`<i class="badge">${nf}</i>`:""}</button>`).join("");
}
function ir(k){ tab = k; window.scrollTo(0,0); pintar(); }
function pintar(){
  nav();
  const f = {cola:vCola, redes:vRedes, com:vCom, oficina:vOficina, ajustes:vAjustes, rend:vRend}[tab];
  $("#vista").innerHTML = (D.pausa && !cambio("pausa") ? `<div class="aviso">⏸️ El bot está en pausa: no se publica nada.</div>` : "") + f();
  const b = $("#aplicar"); b.style.display = cambios.length ? "block" : "none";
  b.textContent = `✅ Aplicar ${cambios.length} cambio${cambios.length>1?"s":""}`;
}
// ---------- cambios pendientes (se mandan todos juntos al bot)
function cambio(a, id){ return cambios.find(c => c.a===a && (id===undefined || c.id===id || c.k===id)); }
function poner(c){ cambios = cambios.filter(x => !(x.a===c.a && (x.id??x.k)===(c.id??c.k))); if(!c.quitar) cambios.push(c); pintar(); }
function aplicar(){
  const datos = JSON.stringify({v:1, acc:cambios});
  if (enTelegram) { tg.sendData(datos); return; }
  alert("Abre el panel desde el botón «📱 Panel» del bot para aplicar cambios.");
}
function subir(){
  if (enTelegram) { tg.sendData(JSON.stringify({v:1, acc:[...cambios, {a:"subir"}]})); return; }
  location.href = BOT;
}
// ---------- 📅 cola
function titulo(texto){ const l = texto.split("\n").filter(x=>x.trim());
  return l.length>1 && /COMBI LOCAS/i.test(l[0]) ? l[1] : l[0] || ""; }
function patas(texto){ return texto.split("\n").filter(l => /^\s*(🎯|✅|🍀)/.test(l) && !/COMBI LOCAS|¿LA PINTAMOS/i.test(l)).slice(0,6)
  .map(l => esc(l.replace(/\s*\[x[\d.]+\]/, "")).replace(/^(🎯|✅)\s*/, "• ")); }
function cuotaDe(texto){ const m = texto.match(/(?:Cuota total aprox\.:|CUOTA|Cuota @|@|x)\s*(\d+,\d\d)/); return m ? m[1] : ""; }
function vCola(){
  if (!D.cola.length) return `<div class="vacio">No hay nada programado en las próximas 48 h</div>`;
  const vivos = D.cola.filter(p => !p.cancelado);
  const hoy = new Date().toISOString().slice(0,10);
  const p0 = vivos[0];
  let h = p0 ? `<div class="prox"><div class="t">Lo siguiente · ${p0.fecha.slice(11,16)}</div><div class="n">${esc(titulo(cambio("texto",p0.id)?.t || p0.texto))}</div><div class="mut" style="color:#c7d7fe">${esc(p0.tipo)}</div></div>` : "";
  h += `<div class="resumen"><div><b>${vivos.filter(p=>p.fecha.slice(0,10)===hoy).length}</b><span>salen hoy</span></div><div><b>${vivos.length}</b><span>en 48 h</span></div><div><b>${D.cola.length-vivos.length}</b><span>cancelados</span></div></div>`;
  let ult = "";
  D.cola.forEach(p => {
    const d = dia(p.fecha); if (d !== ult) { h += `<h2>${d}</h2>`; ult = d; }
    const cH = cambio("hora", p.id), cT = cambio("texto", p.id), cC = cambio("cancelar", p.id), cR = cambio("recuperar", p.id), cY = cambio("ya", p.id);
    const cancel = (p.cancelado && !cR) || cC;
    const texto = cT ? cT.t : p.texto, abierto = abiertos.has(p.id), ps = patas(texto), q = cuotaDe(texto);
    h += `<div class="card ${cancel?"cancel":""} ${cH||cT||cC||cR||cY?"pend":""}">
      <div class="post" onclick="abrir('${p.id}')">
        <div class="h">${esc(cY?"Ya":cH?cH.h:p.fecha.slice(11,16))}${q?`<small>x${esc(q)}</small>`:""}</div>
        <div class="sp"><div class="tit">${esc(titulo(texto))}</div><div class="tipo">${esc(p.tipo)}${p.editado||cT?" · ✏️ editado":""}${cancel?" · ✕ cancelado":""}</div></div>
      </div>
      ${p.imagen && !abierto ? `<img class="banner" loading="lazy" src="${esc(p.imagen)}" onclick="abrir('${p.id}')">` : ""}
      ${ps.length && !abierto ? `<div class="patas">${ps.join("<br>")}</div>` : ""}
      ${abierto ? (editando===p.id ? `<textarea id="ed">${esc(texto)}</textarea>
          <div class="acciones"><button class="btn acc" onclick="guardarTexto('${p.id}')">Guardar texto</button><button class="btn" onclick="editando=null;pintar()">Cancelar</button></div>`
        : `${p.imagen?`<img class="img" loading="lazy" src="${esc(p.imagen)}">`:""}<div class="txt abierto">${esc(texto)}</div>`) : ""}
      ${editando===p.id ? "" : `<div class="iconos">
        <button class="btn" onclick="editando='${p.id}';abiertos.add('${p.id}');pintar()"><span>✏️</span>Texto</button>
        <label class="btn" style="position:relative"><span>🕒</span>Hora<input type="time" value="${esc(cH?cH.h:p.fecha.slice(11,16))}" style="position:absolute;inset:0;opacity:0;width:100%;height:100%" onchange="poner({a:'hora',id:'${p.id}',h:this.value,f:'${p.fecha.slice(0,10)}'})"></label>
        <button class="btn ${cY?"acc":""}" onclick="poner({a:'ya',id:'${p.id}',quitar:!!cambio('ya','${p.id}')})"><span>⚡</span>Sacar ya</button>
        ${cancel ? `<button class="btn" onclick="${cC?`poner({a:'cancelar',id:'${p.id}',quitar:true})`:`poner({a:'recuperar',id:'${p.id}'})`}"><span>↩️</span>Recuperar</button>`
                 : `<button class="btn ko" onclick="${cR?`poner({a:'recuperar',id:'${p.id}',quitar:true})`:`poner({a:'cancelar',id:'${p.id}'})`}"><span>✕</span>Cancelar</button>`}
      </div>`}
    </div>`;
  });
  return h + `<div class="mut" style="text-align:center;margin-top:8px">Toca un post para ver el texto entero y la foto</div>`;
}
function abrir(id){ abiertos.has(id) ? abiertos.delete(id) : abiertos.add(id); pintar(); }
function guardarTexto(id){ const t = $("#ed").value; const p = D.cola.find(x=>x.id===id); editando = null;
  poner({a:"texto", id, t, quitar: t === p.texto}); }
// ---------- 📡 redes
const ICO = {telegram:"✈️", threads:"@", instagram:"📷"};
function vRedes(){
  const conFallo = p => Object.values(p.redes).some(r=>r.error);
  const fallos = D.redes.filter(conFallo), resto = D.redes.filter(p=>!conFallo(p));
  const pend = D.redes.reduce((n,p)=>n+Object.values(p.redes).filter(r=>!r.ok&&!r.error).length,0);
  let h = `<div class="resumen"><div><b>${D.redes.length}</b><span>posts 30 h</span></div><div><b style="color:${fallos.length?"var(--ko)":"var(--ok)"}">${fallos.length}</b><span>con fallos</span></div><div><b>${pend}</b><span>pendientes</span></div></div>`;
  if (fallos.length) h += `<h2>Con fallos</h2>` + fallos.map(p => `<div class="card"><div class="post"><div class="h" style="font-size:18px">${p.fecha.slice(11,16)}</div><div class="sp"><div class="tit">${esc(p.titulo)}</div><div class="tipo">${esc(p.tipo)} · ${dia(p.fecha)}</div></div></div>
      ${Object.entries(p.redes).filter(([,r])=>r.error).map(([red,r]) => `<div style="margin-top:10px"><span class="pill ko">${ICO[red]} ${red} ✕</span> <span class="mut">${esc(r.error)}</span>
        ${r.bloqueo?`<div class="mut" style="margin-top:6px">ℹ️ ${esc(r.bloqueo)}</div>`:`<div style="margin-top:8px"><button class="btn ${cambio('retry',r.clave)?'acc':''}" onclick="poner({a:'retry',k:'${r.clave}',quitar:!!cambio('retry','${r.clave}')})">🔁 Reintentar en ${red}</button></div>`}</div>`).join("")}</div>`).join("");
  else h += `<div class="card row"><span style="font-size:24px">👌</span><div class="sp"><b>Todo publicado bien</b><div class="mut">Sin fallos en las últimas 30 h</div></div></div>`;
  h += `<h2>Últimas 30 h</h2><div class="lista">` + resto.map(p => `<div class="fila-red"><b style="min-width:48px">${p.fecha.slice(11,16)}</b><div class="sp" style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.titulo)}</div>
      ${Object.entries(p.redes).map(([red,r]) => `<span class="pill ${r.ok?"ok":""}" title="${red}">${r.ok?ICO[red]:"⏳"}</span>`).join("")}</div>`).join("") + `</div>
    <div class="mut" style="margin-top:8px">Verde = publicado · ⏳ = aún no ha salido en esa red</div>`;
  return h;
}
// ---------- 💬 comentarios
function vCom(){
  if (!D.comentarios.length) return `<div class="vacio">💬 No hay comentarios nuevos sin contestar</div>`;
  // 09/11: arriba las que tienen respuesta de Claude; cada comentario con cómo acabó su post
  const L = [...D.comentarios].sort((a,b) => (b.claude?1:0)-(a.claude?1:0));
  const nC = L.filter(c=>c.claude).length;
  window._todas = () => { L.filter(c=>c.claude && !cambio("resp",c.id) && !cambio("ignorar",c.id)).forEach(c =>
    cambios.push({a:"resp",id:c.id,post:c.post_id,u:c.usuario,c:c.id,t:c.claude})); pintar(); };
  return `<div class="row" style="margin:6px 2px 10px"><span class="mut sp">Toca una respuesta y dale a Aplicar: la pone el bot en Threads.</span>${nC?`<button class="btn sm" onclick="_todas()">🤖 Todas las de Claude (${nC})</button>`:""}</div>` + L.map(c => {
    const r = cambio("resp", c.id), ig = cambio("ignorar", c.id);
    const sug = c.claude ? [c.claude, ...(c.sugerencias||[]).filter(s=>s!==c.claude)] : (c.sugerencias||[]);
    return `<div class="card ${r||ig?"pend":""} ${ig?"cancel":""}"><div class="row"><b class="sp">@${esc(c.usuario)}</b>${c.resultado?`<span class="chip ${/Entró/.test(c.resultado)?"ok":/Falló/.test(c.resultado)?"ko":"warn"}">${esc(c.resultado)}</span>`:""}<span class="mut">${esc((c.fecha||"").slice(11,16))}</span></div>
      <div class="mut">en «${esc(c.post)}»${c.por?` · 🤖 ${esc(c.por)}`:""}</div><div style="margin-top:6px;font-size:15px">${esc(c.texto)}</div>
      <div class="sug">${sug.map((s,i) => `<button class="btn ${r&&r.t===s?"sel":""}" onclick='poner({a:"resp",id:${JSON.stringify(c.id)},post:${JSON.stringify(c.post_id)},u:${JSON.stringify(c.usuario)},c:${JSON.stringify(c.id)},t:${JSON.stringify(s)},quitar:${!!(r&&r.t===s)}})'>${c.claude&&i===0?"🤖 ":""}${esc(s)}</button>`).join("")}
        <div class="row"><button class="btn sm" onclick='escribir(${JSON.stringify(c.id)})'>✏️ Escribo yo</button><button class="btn sm" onclick='poner({a:"ignorar",id:${JSON.stringify(c.id)},quitar:${!!ig}})'>🙈 No contestar</button></div>
        ${r && !(c.sugerencias||[]).includes(r.t) ? `<div class="chip ok" style="margin-top:4px">«${esc(r.t)}»</div>` : ""}</div></div>`;
  }).join("");
}
function escribir(id){ const c = D.comentarios.find(x=>x.id===id);
  const t = prompt("Tu respuesta a @"+c.usuario+":", c.claude || "");
  if (t && t.trim()) poner({a:"resp", id, post:c.post_id, u:c.usuario, c:c.id, t:t.trim()}); }
// ---------- 🎛️ ajustes
function valor(k){ const c = cambio("ajuste", k); return c ? c.v : D.ajustes[k].v; }
function vAjustes(){
  const pausa = cambio("pausa") ? cambio("pausa").v : D.pausa;
  let h = `<div class="card row"><div class="sp"><b>${pausa?"⏸️ Bot en pausa":"▶️ Bot publicando"}</b><div class="mut">Para todo de golpe (Telegram y redes)</div></div>
    <button class="switch ${pausa?"":"on"}" onclick="poner({a:'pausa',k:'pausa',v:${!pausa},quitar:${!pausa}===D.pausa})"></button></div>`;
  const grupos = [["Contenido",["gifs","noche","enlace_threads"]],["Combis con escudos",["cuota_min","cuota_max","patas"]],["Horarios",["hora_escalera","hora_x3","hora_loca","hora_picks"]]];
  grupos.forEach(([g, ks]) => { h += `<h2>${g}</h2>` + ks.map(k => {
    const a = D.ajustes[k], v = valor(k), pend = cambio("ajuste", k);
    const ctrl = a.tipo==="si_no" ? `<button class="switch ${v?"on":""}" onclick="aj('${k}',${!v})"></button>`
      : a.tipo==="num" ? `<div class="step"><button class="btn sm" onclick="aj('${k}',Math.max(${a.min},+(${v}-${a.paso}).toFixed(1)))">−</button><b>${String(v).replace(".",",")}</b><button class="btn sm" onclick="aj('${k}',Math.min(${a.max},+(${v}+${a.paso}).toFixed(1)))">+</button></div>`
      : `<input type="time" value="${esc(v)}" onchange="aj('${k}',this.value)">`;
    return `<div class="card row ${pend?"pend":""}"><div class="sp"><b>${esc(a.t)}</b>${a.d?`<div class="mut">${esc(a.d)}</div>`:""}</div>${ctrl}</div>`; }).join(""); });
  return h + `<div class="mut" style="margin-top:6px">Los cambios de combis y horarios se notan en las combis que el bot prepare a partir de ahora.</div>`;
}
function aj(k, v){ poner({a:"ajuste", k, v, quitar: v === D.ajustes[k].v}); }

// ---------- 🏢 oficina (10/11): cada rol es un muñeco en su sala; al pulsar, su ficha con lo que ha hecho y sus ajustes
const OF_COL = {ojeador:["#3b82f6","#2b1a0e","#60a5fa"], analista:["#f97316","#111","#fdba74"], redactor:["#a855f7","#6b3a1e","#d8b4fe"],
  verificador:["#22c55e","#d4a017","#86efac"], community:["#ec4899","#1b1b1b","#f9a8d4"], vigilante:["#eab308","#3f3f46","#fde68a"], cazador:["#ef4444","#3b2412","#fca5a5"]};
const OF_EST = {trabajando:"Trabajando", esperando:"Esperando", pausa:"En pausa", alerta:"¡Ojo!"};
let ofSel = "ojeador";
function rv(a){ const c = cambio("ajuste", a.k); return c ? c.v : a.v; }
function ajr(k, v, def){ poner({a:"ajuste", k, v, quitar: v === def}); }
function vOficina(){
  const O = D.oficina;
  if (!O || !O.roles) return `<div class="vacio">La oficina aún no tiene datos. Vuelve en unos minutos.</div>`;
  let h = `<div class="of-tit">OFICINA COMBILOCAS</div><div class="mut" style="margin-bottom:10px">Pulsa en una sala para ver qué hace y cambiarle cosas · act. ${esc(O.generado.slice(11))}</div><div class="of-grid">`;
  h += O.roles.map(r => { const [cu, pe, pa] = OF_COL[r.id] || ["#888","#333","#ccc"];
    const pausa = r.ajustes.find(a => a.k === "pausa_"+r.id), est = pausa && rv(pausa) ? "pausa" : (pausa && !rv(pausa) && r.estado==="pausa" ? "esperando" : r.estado);
    return `<button class="of-sala ${est} ${r.id===ofSel?"sel":""}" onclick="ofSel='${r.id}';pintar()" aria-label="Ficha de ${esc(r.t)}">
      <div class="of-cab"><span class="of-nom">${esc(r.t.toUpperCase())}</span><span class="of-est ${est}">${OF_EST[est]||est}</span></div>
      <div class="of-boc">${esc(r.ahora)}</div>
      <div class="of-esc" aria-hidden="true"><div class="of-suelo"></div><div class="of-mesa"></div><div class="of-mon"><i style="${est==="trabajando"||est==="alerta"?"background-color:"+pa:""}"></i></div>
        <div class="of-pj"><div class="ca"></div><div class="pe" style="background:${pe}"></div><div class="ojo" style="left:19px"></div><div class="ojo" style="left:27px"></div>
        <div class="cu" style="background:${cu}"></div><div class="br" style="background:${cu}"></div></div></div>
      <div class="of-pie">${esc(r.ritmo)}</div></button>`; }).join("") + `</div>`;
  const r = O.roles.find(x => x.id === ofSel) || O.roles[0];
  h += `<div class="of-ficha"><div class="row"><div class="sp"><div class="of-nom" style="font-size:11px">FICHA · ${esc(r.t.toUpperCase())}</div><div class="mut" style="margin-top:6px">${esc(r.d)}</div></div></div>`;
  h += `<h3>LO QUE HA HECHO HOY</h3>` + (r.historial.length ? r.historial.map(x => `<div class="of-li"><b>${esc(x.h)}</b><span>${esc(x.t)}</span></div>`).join("") : `<div class="mut">Nada todavía hoy.</div>`);
  if (r.pendientes) h += `<h3>VERDES ESPERANDO TU OK</h3>` + (r.pendientes.length ? r.pendientes.map(p => { const c = cambio("verde", p.id);
    return `<div class="of-pend ${c?"pend":""}">${esc(p.texto)}${c?`<div class="mut" style="color:#92400e;margin-top:4px">${c.ok?"✅ Saldrá al aplicar":"❌ No saldrá"}</div>`:""}
      <div class="acciones"><button class="btn acc of-pix" onclick="poner({a:'verde',id:'${esc(p.id)}',ok:true,quitar:${!!(c&&c.ok)}})">✅ Publicar</button>
      <button class="btn of-pix" style="background:#e5e7eb;color:#1b1b1b" onclick="poner({a:'verde',id:'${esc(p.id)}',ok:false,quitar:${!!(c&&!c.ok)}})">❌ No sale</button></div></div>`; }).join("") : `<div class="mut">Nada pendiente.</div>`);
  if (r.id === "community") h += `<h3>RESPUESTAS</h3><div class="of-aj"><span class="sp">${r.propuestas||0} respuestas propuestas por Claude</span><button class="btn sm acc of-pix" onclick="ir('com')">Ver y aprobar</button></div>`;
  if (r.canales) h += `<h3>CANALES QUE LEE</h3>` + r.canales.map(c => { const k = "canal:"+c.n, p = cambio("canal", k), on = p ? p.v : c.on;
    return `<div class="of-aj ${p?"pend":""}"><span class="sp">${esc(c.n)} <span class="mut">· ${c.posts} hoy</span></span><button class="switch ${on?"on":""}" aria-label="Leer ${esc(c.n)}" onclick="poner({a:'canal',k:'${esc(k).replace(/'/g,"\\'")}',n:${esc(JSON.stringify(c.n))},v:${!on},quitar:${!on}===${c.on}})"></button></div>`; }).join("");
  if (r.ajustes.length) h += `<h3>AJUSTES</h3>` + r.ajustes.map(a => { const v = rv(a), pend = cambio("ajuste", a.k);
    const ctrl = a.tipo==="si_no" ? `<button class="switch ${v?"on":""}" aria-label="${esc(a.t)}" onclick="ajr('${a.k}',${!v},${a.v})"></button>`
      : a.tipo==="num" ? `<div class="step"><button class="btn sm" onclick="ajr('${a.k}',Math.max(${a.min},+(${v}-${a.paso}).toFixed(2)),${a.v})">−</button><b>${String(v).replace(".",",")}</b><button class="btn sm" onclick="ajr('${a.k}',Math.min(${a.max},+(${v}+${a.paso}).toFixed(2)),${a.v})">+</button></div>`
      : a.tipo==="hora" ? `<input type="time" value="${esc(v)}" onchange="ajr('${a.k}',this.value,'${esc(a.v)}')">`
      : `<input type="text" value="${esc(v)}" maxlength="80" onchange="ajr('${a.k}',this.value.trim(),${esc(JSON.stringify(a.v))})">`;
    return `<div class="of-aj ${pend?"pend":""}" style="${a.tipo==="texto"?"flex-wrap:wrap":""}"><div class="sp"><b>${esc(a.t)}</b>${a.d?`<div class="mut">${esc(a.d)}</div>`:""}</div>${ctrl}</div>`; }).join("");
  return h + `<div class="mut" style="margin-top:10px">Los cambios se mandan al bot con «Aplicar». Las reglas de fondo (sin mercados de 1ª parte, no editar posts publicados…) no se tocan desde aquí.</div></div>`;
}
// ---------- 📈 números
function vRend(){
  const R = D.rendimiento, S = R.seguidores;
  let h = `<h2>Seguidores</h2><div class="grid3">` + [["threads","Threads"],["instagram","Instagram"],["telegram","Telegram"]].map(([k,n]) => { const x = S[k]||{};
    return `<div class="card" style="margin:0"><div class="mut">${n}</div><div class="big">${(x.seguidores??"—").toLocaleString("es-ES")}</div><span class="chip ${x.hoy>0?"ok":x.hoy<0?"ko":""}">${x.hoy>0?"+":""}${x.hoy??0} hoy</span></div>`; }).join("") + `</div>`;
  h += `<h2>Lo más visto esta semana (Threads)</h2>` + (R.top.length ? R.top.map((p,i) => `<div class="card row"><b style="font-size:18px;width:22px">${i+1}</b><div class="sp"><b>${esc(p.titulo)}</b><div class="mut">${esc(p.tipo)} · ${p.fecha.slice(8,10)}/${p.fecha.slice(5,7)} ${p.fecha.slice(11,16)}</div></div><b>${p.vistas.toLocaleString("es-ES")}</b></div>`).join("") : `<div class="vacio">Sin datos aún</div>`);
  const barras = (l, et) => { const m = Math.max(...l.map(x=>x.media), 1); return l.map(x => `<div style="margin-bottom:10px"><div class="row"><span class="sp">${esc(x[et])}</span><b>${x.media.toLocaleString("es-ES")}</b><span class="mut">· ${x.n} posts</span></div><div class="barra"><div style="width:${100*x.media/m}%"></div></div></div>`).join(""); };
  h += `<h2>Vistas medias por tipo de post</h2><div class="card">${barras(R.por_tipo, "tipo")}</div>`;
  h += `<h2>Vistas medias por hora</h2><div class="card">${barras(R.por_hora, "franja")}</div><div class="mut">Últimos 14 días, solo Threads.</div>`;
  return h;
}
cargar();
</script>
