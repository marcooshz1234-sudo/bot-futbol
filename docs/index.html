<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Combilocas</title>
<meta name="theme-color" content="#0e3a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Combilocas">
<link rel="apple-touch-icon" href="icono-180.png?v=cl2">
<link rel="icon" href="icono-180.png?v=cl2">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--f:"Roboto Condensed",-apple-system,system-ui,sans-serif;--t:Anton,Impact,"Arial Narrow",sans-serif;--card:rgba(255,255,255,.96);--card2:#eef4ef;--line:#e3ebe5;--txt:#0f2e1a;--sub:#3d5c47;--mut:#6b8573;--ok:#0f7a35;--ko:#d62828;--warn:#ffd400;--live:#e8590c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#1b6e34}
body{margin:0;color:var(--txt);font:16px/1.4 var(--f);background:repeating-linear-gradient(90deg,#1f7a3a 0 34px,#1b6e34 34px 68px) fixed;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(74px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(14,58,30,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px 10px;border-bottom:3px solid var(--warn)}
.marca-logo{width:46px;height:46px;object-fit:contain;border-radius:50%;flex-shrink:0}
header h1{margin:0;font:400 26px/1 var(--t);letter-spacing:1.5px;color:#fff}
header small{color:#cfe8d6;font-size:12px}
main{padding:12px 14px;max-width:760px;margin:0 auto}
h2{font:400 18px/1.2 var(--t);letter-spacing:1px;text-transform:uppercase;color:#fff;margin:22px 4px 8px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
main>.mut,main>.empty{color:#eaf6ee!important;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}.col{display:flex;flex-direction:column}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--sub);white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.verde{background:#d9f2e1;color:var(--ok)}.rojo{background:#fde2e2;color:var(--ko)}
.va_bien{background:#e6f6ea;color:var(--ok)}.va_mal{background:#ffe8d6;color:var(--live)}
.live{background:var(--warn);color:var(--txt)}.warn{background:var(--warn);color:var(--txt)}
.leg{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.leg:first-of-type{border-top:0}
.cuota{font:400 19px/1 var(--t);color:var(--ok);letter-spacing:.5px}
.big{font:400 30px/1.1 var(--t);letter-spacing:.5px}
.mut{color:var(--mut);font-size:13px}.sub{color:var(--sub);font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:rgba(255,255,255,.88);color:var(--txt);border-radius:20px;padding:7px 14px;font:700 14px var(--f);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs button.on{background:var(--warn);color:var(--txt)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.97);border-top:3px solid var(--warn);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;background:none;border:0;color:var(--mut);font:700 11px var(--f);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;text-transform:uppercase}
nav button span{font-size:21px;line-height:1.1}nav button.on{color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.stat b{display:block;font:400 28px/1.15 var(--t);letter-spacing:.5px}
input,select{width:100%;background:#fff;border:2px solid transparent;color:var(--txt);border-radius:10px;padding:10px 12px;font:16px var(--f);box-shadow:0 1px 3px rgba(0,0,0,.12)}
input:focus{outline:0;border-color:var(--warn)}
.match{display:flex;align-items:center;gap:8px}
.match img{width:22px;height:22px;object-fit:contain}
.team{display:flex;align-items:center;gap:6px;min-width:0;font-weight:700}.team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font:400 22px/1 var(--t);min-width:54px;text-align:center;letter-spacing:.5px}
.ficha{margin-top:10px;border-top:2px solid var(--line);padding-top:10px;display:none}.open .ficha{display:block}
.ficha h2{color:var(--txt);text-shadow:none;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:5px 4px;text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase}
tr+tr td{border-top:1px solid var(--line)}
.forma{white-space:nowrap}.forma i{display:inline-block;width:17px;height:17px;border-radius:4px;font:700 10px/17px var(--f);text-align:center;margin-right:2px;font-style:normal}
.fG{background:#1f9d4c;color:#fff}.fE{background:#a8b8ad;color:#0f2e1a}.fP{background:var(--ko);color:#fff}
.bar{height:9px;border-radius:5px;background:var(--card2);overflow:hidden}.bar>div{height:100%;background:var(--ok);border-radius:5px}
.btn{border:0;background:var(--warn);color:var(--txt);font:700 14px var(--f);border-radius:10px;padding:8px 14px;text-transform:uppercase}
.btn2{border:0;background:var(--card2);color:var(--txt);font:700 13px var(--f);border-radius:10px;padding:7px 12px;text-decoration:none;display:inline-block}
header .btn2{background:rgba(255,255,255,.15);color:#fff}
pre{white-space:pre-wrap;font:15px/1.45 var(--f);margin:8px 0;color:var(--txt);background:var(--card2);padding:10px;border-radius:8px}
.steps{display:flex;gap:4px;margin:8px 0}.steps div{flex:1;height:10px;border-radius:3px;background:var(--card2)}
.empty{color:#eaf6ee;text-align:center;padding:18px;font-size:15px}
.card .empty{color:var(--mut);text-shadow:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--warn);color:var(--txt);font-weight:700;padding:8px 16px;border-radius:20px;opacity:0;transition:.25s;z-index:20}
.toast.on{opacity:1}
svg text{fill:var(--mut);font:11px var(--f)}
details summary{cursor:pointer}
</style>
</head>
<body>
<header><div class="row"><img class="marca-logo" src="logo.png?v=cl2" alt="Logo Combilocas"><h1>COMBILOCAS</h1><span class="sp"></span><button class="btn2" id="recargar" aria-label="Actualizar">↻</button></div><small id="act">Cargando…</small></header>
<main id="vista"></main>
<div style="text-align:center;color:rgba(255,255,255,.75);font:600 12px var(--f);margin:6px 16px 96px">🔞 +18 · Juega con responsabilidad · Son datos e información, no consejos de apuesta</div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
const RAW = "https://raw.githubusercontent.com/marcooshz1234-sudo/bot-futbol/main/docs/datos.json";
const PUBLICA = location.pathname.includes("/publica");
const MERCADOS_ES = {"Goals Over/Under":"Más de X goles","Goals Over/Under First Half":"Goles en la 1ª parte","Goals Over/Under - Second Half":"Goles en la 2ª parte",
  "Both Teams Score":"Ambos marcan","Total - Home":"Goles del local","Total - Away":"Goles del visitante","Double Chance":"Doble oportunidad",
  "Match Winner":"Ganador del partido","To Win Either Half":"Gana alguna parte","Corners Over Under":"Córners totales",
  "Home Corners Over/Under":"Córners del local","Away Corners Over/Under":"Córners del visitante","Cards Over/Under":"Tarjetas totales",
  "Home Team Total Cards":"Tarjetas del local","Away Team Total Cards":"Tarjetas del visitante","Total Shots":"Tiros totales",
  "Total ShotOnGoal":"Tiros a puerta totales","Offsides Total":"Fueras de juego","Home Player Shots":"Tiros de jugador (local)",
  "Away Player Shots":"Tiros de jugador (visitante)","Home Player Shots On Target Total":"Tiros a puerta de jugador (local)",
  "Away Player Shots On Target Total":"Tiros a puerta de jugador (visitante)","Total Goals/Both Teams To Score":"Goles y ambos marcan",
  "Results/Both Teams Score":"Resultado y ambos marcan"};
const nombreMercado = m => MERCADOS_ES[m] || m;   // versión para compartir: sin lo interno
const PESTANAS = [["hoy","⚽","Hoy"],["partidos","📅","Partidos"],["contenido","✍️","Contenido"],["stats","📈","Stats"],["bot","🤖","Bot"]]
  .filter(([k]) => !PUBLICA || !["contenido","bot"].includes(k));
let D = null, tab = guardado("tab") || "hoy"; if(PUBLICA && ["contenido","bot"].includes(tab)) tab = "hoy"; let _x, sub = {}, abiertos = new Set();
function guardado(k){try{return localStorage.getItem("cl_"+k)}catch(e){return null}}
function guardar(k,v){try{localStorage.setItem("cl_"+k,v)}catch(e){}}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n2 = x => x == null ? "—" : Number(x).toFixed(2).replace(".", ",");
const num = x => x == null ? "—" : Math.round(x).toLocaleString("es-ES");
const eur = x => x == null ? "—" : (x >= 0 ? "+" : "") + Number(x).toFixed(2).replace(".", ",") + " €";
const diaTxt = d => { if(!D) return d; if(d===D.hoy) return "Hoy"; if(d===D.manana) return "Mañana"; const f=new Date(d+"T12:00"); return f.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"}) };
const ESTADO = {verde:["✅ Verde","verde"],rojo:["❌ Roja","rojo"],va_bien:["🟢 Va bien","va_bien"],va_mal:["🟠 Va mal","va_mal"],en_juego:["En juego","live"],pendiente:["Pendiente",""]};
const chipEstado = e => { const [t,c] = ESTADO[e] || ESTADO.pendiente; return `<span class="chip ${c}">${t}</span>` };
function toast(t){const x=$("#toast");x.textContent=t;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),1600)}
async function copiar(t){try{await navigator.clipboard.writeText(t);toast("Copiado")}catch(e){toast("No se pudo copiar")}}

async function cargar(){
  $("#act").textContent = "Actualizando…";
  try { const r = await fetch("datos.json?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) throw 0; D = await r.json(); }
  catch(e){ try { D = await (await fetch(RAW+"?t="+Date.now(), {cache:"no-store"})).json() } catch(e2){} }
  if(!D){ $("#vista").innerHTML = `<div class="empty">Sin conexión. Prueba otra vez.</div>`; $("#act").textContent=""; return }
  $("#act").textContent = "Datos del bot · " + D.generado.slice(8,10)+"/"+D.generado.slice(5,7)+" "+D.generado.slice(11);
  pintar();
}
function nav(){ $("#nav").innerHTML = PESTANAS.map(([k,i,t]) => `<button class="${k===tab?"on":""}" onclick="ir('${k}')"><span>${i}</span>${t}</button>`).join("") }
function ir(k){ tab=k; guardar("tab",k); window.scrollTo(0,0); pintar() }
function subTabs(id, ops, def){ const v = sub[id] || def; return [v, `<div class="tabs">${ops.map(([k,t]) => `<button class="${k===v?"on":""}" onclick="sub['${id}']='${k}';pintar()">${t}</button>`).join("")}</div>`] }
function pintar(){ nav(); if(!D) return; $("#vista").innerHTML = `<div style="margin-bottom:12px">${avisoDatos(D.generado_iso)}</div>` + ({hoy:vHoy,partidos:vPartidos,contenido:vContenido,stats:vStats,bot:vBot})[tab](); }

/* ---------------- HOY ---------------- */
function legs(picks){ return picks.map(p => `<div class="leg"><div class="col sp"><span>${esc(p.texto)}</span><span class="mut">${esc(p.partido||"")} · ${(p.fecha||"").slice(11)}</span>${progresoPick(p)}</div><span class="cuota">${n2(p.cuota)}</span>${chipEstado(p.estado)}</div>`).join("") }
function vHoy(){
  const ayer = ayerDe(D.hoy);
  const [dia, t] = subTabs("hoydia", [[ayer,"Ayer"],[D.hoy,"Hoy"],[D.manana,"Mañana"]], D.hoy);
  const d = D.dias[dia] || {picks:[],combis:{}};
  let h = t;
  const tops = d.picks.filter(p => p.a_favor && p.a_favor.top && p.estado==="pendiente" && (p.pct_real??p.frecuencia)>=70);   // 27/10: «todo a favor» con un 60 % no lo es
  if(tops.length){ h += `<h2>⭐ Con todo a favor</h2><div class="card" style="border-left:5px solid var(--warn)">` + tops.slice(0,6).map(p => `<div class="leg"><div class="col sp"><span><b>${esc(p.texto)}</b></span><span class="mut">${esc(p.partido)} · ${p.fecha.slice(11)} · a favor: ${p.a_favor.si.join(", ")}</span></div><span class="cuota">${n2(p.cuota)}</span><span class="chip warn">${p.pct_real??p.frecuencia}%</span></div>`).join("") + `</div>` }
  const gd = (D.goleadores_hoy||[]).filter(x => x.fecha.slice(0,10)===dia && x.cuota).sort((a,b)=>(b.valor??-9)-(a.valor??-9))[0];
  if(gd){ h += `<h2>⚽ Goleador del día</h2><div class="card row"><span style="font-size:30px">⚽</span><div class="col sp"><b>${esc(gd.jugador)} marca</b><span class="mut">${esc(gd.partido)} · ${gd.fecha.slice(11)} · ${gd.goles} goles en ${gd.partidos} partidos (${String(gd.media).replace(".",",")}/partido)</span></div><span class="cuota big" style="font-size:22px">${n2(gd.cuota)}</span></div>` }
  if(D.alertas.length){ h += `<h2>🚨 Alertas de cuota</h2>` + D.alertas.map(a => `<div class="card"><div class="row"><b class="sp">${esc(a.texto)}</b><span class="chip warn">+${a.sube}%</span></div><div class="row mut" style="margin-top:4px"><span class="sp">${esc(a.partido)} · ${a.fecha.slice(11)} · se cumplió ${a.frecuencia}%</span><span>${n2(a.antes)} → <b class="cuota">${n2(a.cuota)}</b></span></div></div>`).join("") }
  const vivos = D.partidos.filter(esVivo);
  if(dia===D.hoy && vivos.length){ h += `<h2>🔴 En directo</h2>` + vivos.map(tarjetaPartido).join("") }
  // 27/10: las combis publicadas se quedan con su resultado cuando terminan (verde / roja / en juego)
  const pubs = (D.publicados_hoy||[]).filter(p => p.fecha.slice(0,10)===dia && !esRepostVerde(p)).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(pubs.length){
    const cb = pubs.filter(p=>!p.lista), v = cb.filter(p=>p.estado==="verde").length, r = cb.filter(p=>p.estado==="rojo").length;
    h += `<h2>📣 Publicadas · ${v} ✅ ${r} ❌${cb.length-v-r?` · ${cb.length-v-r} en juego`:""}</h2>` + pubs.map(p => {
      const okN = p.picks.filter(x=>x.estado==="verde").length;
      return `<div class="card" style="${p.lista?"":p.estado==="verde"?"border-left:5px solid var(--ok)":p.estado==="rojo"?"border-left:5px solid var(--ko)":""}">
        <div class="row" style="margin-bottom:4px"><b class="sp">${esc(p.titulo)}${/COMBI LOCAS/.test(p.titulo)&&p.picks[0]&&p.picks[0].partido?`<br><span class="mut" style="font-weight:400">${esc(p.picks[0].partido)}</span>`:""}</b><span class="mut">${p.fecha.slice(11)}</span>${p.cuota?`<span class="cuota">${n2(p.cuota)}</span>`:""}${p.lista?`<span class="chip">${okN}/${p.picks.length} ✅</span>`:p.estado==="verde"?"✅":p.estado==="rojo"?"❌":`<span class="chip">${okN}/${p.picks.length}</span>`}</div>
        ${p.picks.map(x=>`<div class="leg"><div class="col sp"><span>${esc(x.texto)}</span><span class="mut">${esc(x.partido||"")}${x.marcador&&x.marcador[0]!=null?` · ${x.marcador[0]}-${x.marcador[1]}`:""}</span>${progresoPick(x)}</div>${x.cuota?`<span class="cuota">${n2(x.cuota)}</span>`:""}${icono(x)}</div>`).join("")}</div>`;
    }).join("");
  } else if(dia!==D.manana){ h += `<h2>📣 Publicadas</h2><div class="empty">${dia===ayer?"No hubo combis publicadas":"Aún no se ha publicado ninguna combi hoy"}</div>` }
  const nombres = {segura:"🔒 Combi segura", cuota_3:"💥 Cuota 3", loca:"🤪 Combi loca"};
  const cs = Object.entries(d.combis||{});
  if(dia!==ayer && cs.length){ h += `<h2>🧮 Combis previstas</h2><div class="mut" style="margin-bottom:10px">Lo que prepara el bot; pueden cambiar con las cuotas antes de publicarse.</div>` + cs.map(([k,c]) => `<div class="card"><div class="row" style="margin-bottom:4px"><b class="sp">${nombres[k]||k}</b><span class="cuota big" style="font-size:20px">${n2(c.cuota)}</span>${chipEstado(c.estado)}</div>${legs(c.picks)}<div class="mut" style="margin-top:6px">10 € → ${n2(c.cuota*10)} €</div></div>`).join("") }
  const e = D.escalera.actual;
  const eh = (D.escalera.historial||[]).filter(x=>x.dia===dia).pop();
  const pasos = (n, col) => `<div class="steps">${[1,2,3,4,5,6,7].map(i=>`<div style="background:${i<n?"var(--ok)":i===n?col:""}"></div>`).join("")}</div>`;
  if(e && e.dia===dia){ h += `<h2>🪜 Reto escalera</h2><div class="card"><div class="row"><span class="big sp">Día ${e.escalon}<span class="mut" style="font-size:15px">/7</span></span><div class="col" style="text-align:right"><b>${num(e.stake)} € → ${num(e.stake*e.cuota)} €</b><span class="mut">cuota ${n2(e.cuota)} · ${diaTxt(e.dia)}</span></div></div>${pasos(e.escalon,"var(--warn)")}${legs(e.picks.map(p=>({...p,partido:p.local?p.local+" – "+p.visitante:""})))}</div>` }
  else if(eh){ const ok = eh.resultado==="verde"; h += `<h2>🪜 Reto escalera</h2><div class="card" style="border-left:5px solid var(${ok?"--ok":"--ko"})"><div class="row"><span class="big sp">Día ${eh.escalon}<span class="mut" style="font-size:15px">/7</span></span><div class="col" style="text-align:right"><b>${ok?"✅ Superado":"❌ Se cayó"}</b><span class="mut">cuota ${n2(eh.cuota)} · ${num(eh.stake)} €</span></div></div>${pasos(eh.escalon, ok?"var(--ok)":"var(--ko)")}${(eh.picks||[]).length?legs(eh.picks.map(p=>({...p,partido:p.local?p.local+" – "+p.visitante:""}))):""}</div>` }
  else if(e && dia!==D.manana && e.dia>dia){ h += `<h2>🪜 Reto escalera</h2><div class="card"><span>${dia===D.hoy?"Hoy la escalera descansa: no hay dos picks con valor.":"Ese día no hubo escalón."}</span> <span class="mut">Próximo: día ${e.escalon}, ${diaTxt(e.dia).toLowerCase()} a las 11:00.</span></div>` }
  h += `<h2>Picks (${d.picks.length})</h2>` + (d.picks.length ? `<div class="card">` + d.picks.map(p => `<div class="leg"><div class="col sp"><span>${p.a_favor&&p.a_favor.top?"⭐ ":""}${esc(p.texto)}</span><span class="mut">${esc(p.partido)} · ${p.fecha.slice(11)} · ${esc(p.detalle||"")}</span>${extrasPick(p)}${sparkCuota(p)}${progresoPick(p)}</div><div class="col" style="align-items:flex-end;gap:3px"><span class="cuota">${n2(p.cuota)}</span><span class="chip">${p.pct_real??p.frecuencia}%</span></div>${p.estado!=="pendiente"?chipEstado(p.estado):""}</div>`).join("") + `</div>` : `<div class="empty">El bot aún no tiene picks para este día</div>`);
  const gh = (D.goleadores_hoy||[]).filter(x => x.fecha.slice(0,10)===dia);
  if(gh.length){ h += `<h2>⚽ Goleadores que juegan</h2><div class="card">` + gh.map(x => `<div class="leg"><div class="col sp"><span><b>${esc(x.jugador)}</b> marca</span><span class="mut">${esc(x.partido)} · ${x.fecha.slice(11)} · ${x.goles} goles en ${x.partidos} (${String(x.media).replace(".",",")}/partido) · ${x.puesto}º de su liga</span></div>${x.cuota?`<span class="cuota">${n2(x.cuota)}</span>`:`<span class="mut">sin cuota</span>`}${x.valor!=null&&x.valor>0?`<span class="chip verde">valor</span>`:""}</div>`).join("") + `</div>` }
  return h;
}

/* ---------------- PARTIDOS ---------------- */
function forma(f){ return `<span class="forma">${[...(f||"")].map(x=>`<i class="f${x}">${x}</i>`).join("")}</span>` }
function tarjetaPartido(p){
  const vivo = esVivo(p), fin = esFinal(p);
  const marcador = (vivo||fin) && p.goles && p.goles[0]!=null ? `${p.goles[0]} - ${p.goles[1]}` : p.fecha.slice(11);
  const pk = Object.values(D.dias).flatMap(d=>d.picks).filter(x=>x.partido_id===p.id);
  const f = p.ficha;

/* ---------------- STATS ---------------- */
function barras(serie, etq, val, fmt){
  if(!serie.length) return `<div class="empty">Aún no hay datos suficientes</div>`;
  const W=340,H=130,max=Math.max(...serie.map(val).map(Math.abs),1),bw=W/serie.length;
  const cero = serie.some(s=>val(s)<0) ? H/2 : H-14;
  const esc2 = cero===H/2 ? (H/2-14)/max : (H-24)/max;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${serie.map((s,i)=>{const v=val(s),h=Math.abs(v)*esc2,y=v>=0?cero-h:cero;return `<rect x="${i*bw+3}" y="${y}" width="${bw-6}" height="${Math.max(h,1)}" rx="3" fill="${v>=0?"#0f7a35":"#d62828"}"/><text x="${i*bw+bw/2}" y="${H-2}" text-anchor="middle">${esc(etq(s))}</text>${serie.length<=14?`<text x="${i*bw+bw/2}" y="${v>=0?y-3:y+h+10}" text-anchor="middle" style="fill:var(--sub)">${fmt(v)}</text>`:""}`}).join("")}</svg>`;
}
function linea(puntos, color="#0f7a35"){
  if(puntos.length<2) return `<div class="mut">La gráfica aparece cuando haya datos de 2 días o más.</div>`;
  const W=340,H=110,ys=puntos.map(p=>p[1]),mn=Math.min(...ys),mx=Math.max(...ys),r=(mx-mn)||1;
  const pts=puntos.map((p,i)=>[i*(W-20)/(puntos.length-1)+10,H-18-(p[1]-mn)/r*(H-34)]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map((p,i)=>i===0||i===pts.length-1?`<text x="${p[0]}" y="${H-3}" text-anchor="${i?"end":"start"}">${puntos[i][0].slice(8,10)}/${puntos[i][0].slice(5,7)}</text><text x="${p[0]}" y="${p[1]-6}" text-anchor="${i?"end":"start"}" style="fill:var(--sub)">${num(puntos[i][1])}</text>`:"").join("")}</svg>`;
}

  }
  const E = Object.entries(B.estilos||{}).sort((a,b)=>b[1].nota-a[1].nota);
  if(E.length) h += `<h2>🎨 Estilos de post</h2><div class="card">${E.map(([k,v])=>`<div class="leg"><span class="sp">${esc(k.replace("combi-","").replace(/[-_]/g," "))}</span><span class="mut">${v.verdes}/${v.resultados} verdes · ${v.posts_threads} en Threads</span><span class="chip ${v.nota>=1.05?"verde":v.nota<=0.95?"rojo":""}">${v.nota.toFixed(2)}</span></div>`).join("")}<div class="mut" style="margin-top:6px">Nota 1 = normal. Cada día salen los 2 estilos opcionales con más nota.</div></div>`;
  if(B.comunidad) h += `<h2>🏆 Concurso de seguidores</h2><div class="card"><div class="leg"><span class="sp">Participantes esta semana</span><b>${B.comunidad.participantes}</b></div><div class="leg"><span class="sp">Picks enviados</span><b>${B.comunidad.picks}</b></div></div>`;
  h += `<h2>Conexiones</h2><div class="card">${["instagram","threads","facebook"].map(k=>{const v=r[k]||"—";const ok=String(v).startsWith("OK");return `<div class="leg"><span class="sp">${NOMBRE_RED[k]}</span><span class="chip ${ok?"verde":"rojo"}">${ok?"Conectado":"Revisar"}</span></div>`}).join("")}<div class="leg"><span class="sp">Claves de Meta caducan</span><span class="chip ${diasCad<15?"warn":""}">en ${diasCad} días</span></div><div class="leg"><span class="sp">Picks generados</span><span class="mut">${esc((B.picks_generados||"").replace("T"," ").slice(0,16))}</span></div></div>`;
  h += `<h2>Incidencias de publicación</h2>` + (B.errores.length ? B.errores.slice().reverse().map(e=>`<div class="card"><div class="row"><b class="sp">${esc(e.post)}</b><span class="chip rojo">${esc(e.red)}</span></div><div class="mut">${esc(e.fecha.replace("T"," "))} · ${esc(e.error)}</div><div class="mut" style="margin-top:8px">${esc(e.bloqueo||"Puedes solicitar otro intento en esta red.")}</div>${e.reintentable?`<a class="btn2" style="display:inline-block;margin-top:10px" href="https://t.me/combilocas_publica_bot?start=retry_${encodeURIComponent(e.clave)}" target="_blank" rel="noopener">Reintentar desde mi bot</a>`:""}</div>`).join("") : `<div class="empty">Sin fallos en los dos últimos días 👌</div>`);
  if((B.reintentos||[]).length) h += `<h2>Últimos reintentos</h2>`+B.reintentos.slice().reverse().map(r=>`<div class="card"><b>${esc(r.resultado)}</b><div class="mut">${esc(r.red||"")} · ${esc(r.post||"")}</div><div class="mut">${esc(r.fecha.slice(0,16).replace("T"," "))}</div></div>`).join("");
  h += `<h2>Spam quitado</h2>` + (B.spam.length ? B.spam.map(s=>`<div class="card"><div class="row"><b class="sp">${esc(s.autor)}</b><span class="chip">${esc(s.red)}</span></div><div class="mut">${esc((s.cuando||"").slice(0,16).replace("T"," "))} · ${esc(s.motivo)}</div><div class="sub" style="margin-top:4px">${esc(s.texto)}</div></div>`).join("") : `<div class="empty">Nada de spam por ahora</div>`);
  h += `<h2>Comandos del bot de Telegram</h2><div class="card sub">/hoy · /picks · /manana · /combis · /pausa · /reanudar · /editar · /borrar</div>`;
  return h;
}

setInterval(cargar, 5*60*1000);
setInterval(()=>{if(D && !document.hidden) pintar()}, 60*1000);
nav(); cargar();
