name: Publicar en Telegram y redes
# GitHub lanza los cron con mucho retraso (cada ~40-45 min en vez de 15). Para publicar a la hora
# exacta, cada ejecución se queda ~55 min mirando la cola minuto a minuto. Repo público = minutos gratis.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar lo que toca, minuto a minuto (Telegram, Threads, Instagram, Facebook) y quitar spam
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: "-1003953339107"
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          FACEBOOK_PAGINA: ${{ secrets.FACEBOOK_PAGINA }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          git config user.name "bot-futbol"
          git config user.email "bot-futbol@users.noreply.github.com"
          python -u comprobar_redes.py || true
          fin=$(( $(date +%s) + 55*60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            git pull --rebase -q || git rebase --abort || true
            python -u publicar_telegram.py || echo "Fallo al publicar (se reintenta en 1 min)"
            python -u redes.py || echo "Fallo en redes (se reintenta en 1 min)"
            vuelta=$(( ${vuelta:-0} + 1 ))
            if [ $(( vuelta % 10 )) -eq 1 ]; then python -u moderar.py || echo "Fallo en la moderación"; python -u estadisticas.py || echo "Fallo en estadísticas"; python -u avisos.py || echo "Fallo en avisos"; fi
            if [ $(( vuelta % 5 )) -eq 1 ]; then python -u directo.py || echo "Fallo en directo"; python -u app_datos.py || echo "Fallo en app"; fi
            for ruta in publicaciones docs datos/moderacion.json datos/avisos.json datos/en_directo.json datos/en_directo datos/cuotas_inicio.json; do if [ -e "$ruta" ]; then git add -A "$ruta"; fi; done
            if ! git diff --cached --quiet; then
              git commit -q -m "Telegram: cola actualizada $(date -u +'%Y-%m-%d %H:%M')"
              for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
            fi
            sleep 60
          done
