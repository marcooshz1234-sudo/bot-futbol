name: Publicar en Telegram
# GitHub lanza los cron con mucho retraso (cada ~40-45 min en vez de 15). Para publicar a la hora
# exacta, cada ejecución se queda ~55 min mirando la cola minuto a minuto. Repo público = minutos gratis.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar lo que toca, minuto a minuto
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: "-1003953339107"
        run: |
          git config user.name "bot-futbol"
          git config user.email "bot-futbol@users.noreply.github.com"
          fin=$(( $(date +%s) + 55*60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            git pull --rebase -q || git rebase --abort || true
            python -u publicar_telegram.py || echo "Fallo al publicar (se reintenta en 1 min)"
            git add -A publicaciones
            if ! git diff --cached --quiet; then
              git commit -q -m "Telegram: cola actualizada $(date -u +'%Y-%m-%d %H:%M')"
              for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
            fi
            sleep 60
          done
