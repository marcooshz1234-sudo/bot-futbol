name: Publicar en Telegram
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["publicaciones/cola.json", "publicar_telegram.py", ".github/workflows/telegram.yml"]
permissions:
  contents: write
concurrency:
  group: telegram
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar lo que toca
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: "-1003953339107"
        run: python -u publicar_telegram.py
      - name: Guardar estado de la cola
        run: |
          git config user.name "bot-futbol"
          git config user.email "bot-futbol@users.noreply.github.com"
          git add publicaciones/cola.json publicaciones/estado.json 2>/dev/null || git add publicaciones/cola.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Telegram: cola actualizada $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
