name: Publicar en Telegram y redes
# GitHub lanza los cron con mucho retraso (cada ~40-45 min en vez de 15). Para publicar a la hora
# exacta, cada ejecución se queda ~55 min mirando la cola minuto a minuto. Repo público = minutos gratis.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar lo que toca, minuto a minuto (Telegram, Threads, Instagram, Facebook) y quitar spam
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: "-1003953339107"
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          FACEBOOK_PAGINA: ${{ secrets.FACEBOOK_PAGINA }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          git config user.name "bot-futbol"
          git config user.email "bot-futbol@users.noreply.github.com"
          git config merge.cola.driver "python fusionar_cola.py %O %A %B"
          (sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null 2>&1; pip install -q playwright >/dev/null 2>&1 && python -m playwright install --with-deps chromium >/dev/null 2>&1) || echo "Sin Chromium: no se regeneran imágenes"
          timeout 240 python -u comprobar_redes.py || true
          fin=$(( $(date +%s) + 55*60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            git pull --rebase --autostash -X theirs -q || git rebase --abort || true
            timeout 240 python -u incidencias.py || echo "Fallo al revisar reintentos"
            if [ $(( ${vuelta:-0} % 5 )) -eq 0 ]; then timeout 300 python -u cuotas_frescas.py || echo "Fallo en cuotas frescas"; timeout 300 python -u alineaciones_posts.py || echo "Fallo en alineaciones de posts"; fi
            timeout 240 python -u publicar_telegram.py || echo "Fallo al publicar (se reintenta en 1 min)"
            timeout 600 python -u redes.py || echo "Fallo en redes (se reintenta en 1 min)"
            vuelta=$(( ${vuelta:-0} + 1 ))
            if [ $(( vuelta % 10 )) -eq 1 ]; then timeout 240 python -u moderar.py || echo "Fallo en la moderación"; timeout 240 python -u estadisticas.py || echo "Fallo en estadísticas"; timeout 240 python -u avisos.py || echo "Fallo en avisos"; timeout 240 python -u revisor.py || echo "Fallo en revisor"; timeout 300 python -u threads_crecer.py || echo "Fallo en threads_crecer"; fi
            if [ $(( vuelta % 10 )) -eq 1 ]; then timeout 240 python -u directo.py || echo "Fallo en directo"; fi; if [ $(( vuelta % 10 )) -eq 1 ]; then timeout 240 python -u app_datos.py || echo "Fallo en app"; timeout 300 python -u verdes_auto.py || echo "Fallo en verdes"; fi
            timeout 120 python -u resumen_dia.py || echo "Fallo en resumen"
            for ruta in publicaciones docs datos/moderacion.json datos/avisos.json datos/en_directo.json datos/en_directo datos/fixtures_dia.json datos/cuotas_inicio.json datos/cuotas_frescas.json datos/revision_avisos.json datos/verdes_auto.json datos/threads_crecer.json datos/threads_vistas.json datos/alineaciones_posts.json; do if [ -e "$ruta" ]; then git add -A "$ruta"; fi; done
            # se guarda al momento si cambia algo de los posts; lo demás (app, directo) cada 5 vueltas
            if ! git diff --cached --quiet && { ! git diff --cached --quiet -- publicaciones || [ $(( vuelta % 5 )) -eq 0 ] || [ "$(date +%s)" -ge $(( fin - 90 )) ]; }; then
              git commit -q -m "Telegram: cola actualizada $(date -u +'%Y-%m-%d %H:%M')"
              for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done
            fi
            sleep 60
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "Telegram: cola actualizada $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done
          fi
