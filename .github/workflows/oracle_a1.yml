name: Oracle A1 (reintentar el servidor gratis)
# 13/11 (Marcos: «reintentar el A1 solo»): prueba cada 10 min a crear el servidor gratis de Oracle hasta que haya
# hueco. Cuando lo consigue guarda oracle/servidor.json y deja de intentarlo. Las claves, en los secretos OCI_*.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # 13/11: los cron de GitHub llegan tarde o no llegan: cada tanda se queda ~55 min probando cada 5
permissions:
  contents: write
concurrency:
  group: oracle-a1
  cancel-in-progress: false
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - name: ¿Ya está creado?
        id: ya
        run: test -f oracle/servidor.json && echo "si=1" >> "$GITHUB_OUTPUT" || echo "si=0" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.ya.outputs.si == '0'
        with:
          python-version: "3.12"
      - if: steps.ya.outputs.si == '0'
        env:
          # identificadores de la cuenta (no son secretos: sin la clave privada no sirven para nada)
          OCI_USER: ocid1.user.oc1..aaaaaaaazadylu2m3riqsevbwvdoydzivp7wfvrouqppxot4u7sgpfb7pn5a
          OCI_TENANCY: ocid1.tenancy.oc1..aaaaaaaaeqfo7msfvozmb55eyr3yldap2ih7arbhuysi6lb2noijoosb6i6q
          OCI_REGION: eu-madrid-1
          OCI_KEY: ${{ secrets.OCI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: "-1003953339107"
        run: |
          if [ -z "$OCI_KEY" ]; then echo "Falta el secreto OCI_KEY"; exit 0; fi
          pip install -q oci
          for i in $(seq 1 11); do
            python -u oracle_a1.py
            [ -f oracle/servidor.json ] && break
            sleep 300
          done
          if [ -f oracle/servidor.json ]; then
            git config user.name "bot-futbol"; git config user.email "bot-futbol@users.noreply.github.com"
            git add oracle/servidor.json && git commit -q -m "Oracle: servidor A1 creado"
            for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done
          fi
