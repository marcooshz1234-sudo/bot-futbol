name: Validar código y panel
on:
  pull_request:
    paths:
      - '*.py'
      - 'tests/**'
      - 'docs/index.html'
      - 'docs/publica/index.html'
      - 'docs/manifest.json'
      - 'docs/publica/manifest.json'
      - '.github/workflows/validar.yml'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - 'docs/index.html'
      - 'docs/publica/index.html'
      - 'docs/manifest.json'
      - 'docs/publica/manifest.json'
      - '.github/workflows/validar.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_panel.cjs
