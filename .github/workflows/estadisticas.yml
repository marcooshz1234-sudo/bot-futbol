name: Estadísticas del widget (a mano)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sacar estadísticas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: "-1003953339107"
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          FACEBOOK_PAGINA: ${{ secrets.FACEBOOK_PAGINA }}
        run: |
          python -u comprobar_redes.py || true
          python - <<'PY' || true
          import os, json
          from redes import llamar, FACEBOOK
          try:
              r = llamar("GET", f"{FACEBOOK}/me/permissions", {"access_token": os.environ["FACEBOOK_TOKEN"]})
              ok = sorted(p["permission"] for p in r.get("data", []) if p.get("status") == "granted")
          except Exception as e:
              ok = [f"error: {e}"]
          e = json.load(open("publicaciones/estado_redes.json")); e["facebook_permisos"] = ok
          json.dump(e, open("publicaciones/estado_redes.json", "w"), ensure_ascii=False, indent=1)
          PY
          python -u estadisticas.py
          python -u listar_redes.py || true
          python -u threads_analisis.py || true
          git config user.name "bot-futbol"
          git config user.email "bot-futbol@users.noreply.github.com"
          git add publicaciones/estadisticas.json publicaciones/estado_redes.json datos/ultimas_redes.json datos/threads_analisis.json
          git diff --cached --quiet || (git commit -qm "Estadísticas del widget" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done)
