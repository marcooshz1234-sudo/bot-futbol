name: Asistente en el móvil
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["asistente.py", ".github/workflows/asistente.yml"]
permissions:
  contents: write
concurrency:
  group: asistente
  cancel-in-progress: true
jobs:
  escuchar:
    # Funciona ~24 h al día: solo con el repositorio público (minutos de GitHub ilimitados)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Escuchar a Marcos por Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: "-1003953339107"
        run: |
          git config user.name "bot-futbol"
          git config user.email "bot-futbol@users.noreply.github.com"
          python -u asistente.py
