name: Bot futbol
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot-futbol
  cancel-in-progress: false
jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger datos y generar informes
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -u bot.py
      - name: Contexto extra (cansancio, tiempo, árbitro, cuotas, tabla) (09/11)
        run: python -u contexto_extra.py || echo "contexto_extra falló (no bloquea)"
      - name: Contexto de la Copa (categoría, arranque, campo, aplazamientos) (09/11)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -u copa_contexto.py || echo "copa_contexto falló (no bloquea)"
      - name: Tarjetas de los árbitros que no conocemos (12/11)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -u arbitros_ext.py || echo "arbitros_ext falló (no bloquea)"
      - name: Aprender de los resultados (corrige los picks terminados, recalibra y manda las lecciones)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: "-1003953339107"
        run: |
          python -u aciertos.py || echo "aciertos falló (no bloquea)"
          python -u calibrar_historico.py || echo "calibración falló (no bloquea)"
          python -u prueba_xg.py || echo "prueba de xG falló (no bloquea)"
          python -u aprender.py || echo "aprender falló (no bloquea)"
          pip install -q numpy >/dev/null 2>&1 || true
          python -u contexto_pata.py || echo "contexto_pata falló (no bloquea)"   # 11/11: descanso, forma, árbitro, tiempo…
          python -u modelo_patas.py || echo "modelo_patas falló (no bloquea)"   # 11/11: modelo nuevo de patas
          python -u tipsters.py || echo "tipsters falló (no bloquea)"   # 09/11: picks de TipsAnalistas y Pérez
      - name: Fuentes extra (ClubElo, Football-Data, OddsPapi) (09/11)
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -u fuentes_extra.py || echo "fuentes_extra falló (no bloquea)"
      - name: Canales de los tipsters (públicos, y privados con la cuenta de Marcos) (10/11)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          pip install -q telethon >/dev/null 2>&1 || true
          python -u lector_canales.py --ya || echo "lector_canales falló (no bloquea)"
      - name: Noticias de los periódicos (09/11)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: "-1003953339107"
        run: python -u noticias.py --ya || echo "noticias falló (no bloquea)"
      - name: Elegir picks y combis
        run: python -u picks.py
      - name: Registro de aciertos y modelo de valor
        run: |
          python -u aciertos.py
          python -u valor.py || echo "valor.py falló (no bloquea)"
      - name: Reto escalera
        run: python -u escalera.py
      - name: Escribir posts con plantillas
        run: python -u plantillas.py
      - name: Imágenes y reels de los posts del bot
        run: |
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          pip install -q playwright pillow && python -m playwright install --with-deps chromium >/dev/null
          python -u imagenes.py publicaciones/auto.json --pendientes || echo "imagenes.py falló (no bloquea)"
      - name: Quitar imágenes de posts viejos (01/11)
        run: python -u limpiar_media.py || echo "limpiar_media falló (no bloquea)"
      - name: Informe de rendimiento del mes (01/11, va a Obsidian)
        run: python -u rendimiento.py || echo "rendimiento falló (no bloquea)"
      - name: Aviso de claves que caducan (01/11)
        run: python -u avisos_claves.py || echo "avisos_claves falló (no bloquea)"
      - name: Informe de redes del mes (01/11, va a Obsidian)
        run: python -u redes_informe.py || echo "redes_informe falló (no bloquea)"
      - name: Guardar cambios
        run: |
          git config user.name "bot-futbol"
          git config user.email "bot-futbol@users.noreply.github.com"
          git add -A datos informes PROXIMOS_PARTIDOS.md PICKS.md ACIERTOS.md VALOR.md RESULTADOS.md LECCIONES.md publicaciones/auto.json publicaciones/media
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizacion de datos $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3 4; do git pull --rebase -q -X theirs || { git rebase --abort; git pull --rebase -q -X theirs; }; git push -q && break; sleep 10; done
          fi
