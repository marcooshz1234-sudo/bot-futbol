name: Bot futbol
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot-futbol
  cancel-in-progress: false
jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger datos y generar informes
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -u bot.py
      - name: Elegir picks y combis
        run: python -u picks.py
      - name: Registro de aciertos y modelo de valor
        run: |
          python -u aciertos.py
          python -u valor.py || echo "valor.py falló (no bloquea)"
      - name: Reto escalera
        run: python -u escalera.py
      - name: Escribir posts con plantillas
        run: python -u plantillas.py
      - name: Guardar cambios
        run: |
          git config user.name "bot-futbol"
          git config user.email "bot-futbol@users.noreply.github.com"
          git add -A datos informes PROXIMOS_PARTIDOS.md PICKS.md ACIERTOS.md VALOR.md RESULTADOS.md publicaciones/auto.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizacion de datos $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
